    function App() {
      const [selectedBook, setSelectedBook] = useState("L0"); 
      
      const [errorList, setErrorList] = useState(() => {
        try { return JSON.parse(localStorage.getItem(`vocab_err_${selectedBook}`)) || []; } catch(e) { return []; }
      });
      const [practicedWords, setPracticedWords] = useState(() => {

      });

        try { return JSON.parse(localStorage.getItem(`vocab_hist_${selectedBook}`)) || {}; } catch(e) { return {}; }
      });

      const [mode, setMode] = useState('all');
      const [direction, setDirection] = useState('flashcard'); 
      const [currentWord, setCurrentWord] = useState(null);
      const [askEnglish, setAskEnglish] = useState(true);
      const [userInput, setUserInput] = useState('');
      
      const [multipleChoiceOptions, setMultipleChoiceOptions] = useState([]);
      const [selectedOption, setSelectedOption] = useState(null); 

      const [feedback, setFeedback] = useState(null); 
      const [attemptCount, setAttemptCount] = useState(0);

      const [isFlipped, setIsFlipped] = useState(false);
const [swipeAnim, setSwipeAnim] = useState(null); // 控制滑動方向 'left' 或 'right'


 
      
      const [rightTab, setRightTab] = useState('current'); 
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, title: '', message: '', onConfirm: null, showCancel: true });
      
      // 內建例句，不需 API 載入狀態
      const [expandedListWord, setExpandedListWord] = useState(null);

      const [battleQueue, setBattleQueue] = useState([]);
      const [battleIndex, setBattleIndex] = useState(0);
      const [battleStep, setBattleStep] = useState(1);
const [currentPage, setCurrentPage] = useState(1);
      useEffect(() => { setCurrentPage(1); }, [selectedBook]);

      const inputRef = useRef(null);
      const fileInputRef = useRef(null);

      const errorListRef = useRef(errorList);
      const modeRef = useRef(mode);
      const directionRef = useRef(direction);
      const practicedWordsRef = useRef(practicedWords);
      const battleQueueRef = useRef(battleQueue);
      const battleIndexRef = useRef(battleIndex);
      const battleStepRef = useRef(battleStep);

      useEffect(() => { errorListRef.current = errorList; }, [errorList]);
      useEffect(() => { modeRef.current = mode; }, [mode]);
      useEffect(() => { directionRef.current = direction; }, [direction]);
      useEffect(() => { practicedWordsRef.current = practicedWords; }, [practicedWords]);
      useEffect(() => { battleQueueRef.current = battleQueue; }, [battleQueue]);
      useEffect(() => { battleIndexRef.current = battleIndex; }, [battleIndex]);
      useEffect(() => { battleStepRef.current = battleStep; }, [battleStep]);

      const isTerminalState = feedback?.status === 'unfamiliar' || feedback?.status === 'wrong' || feedback?.status === 'correct';

        try {
          const loadedErr = JSON.parse(localStorage.getItem(`vocab_err_${selectedBook}`)) || [];
          const loadedPrac = JSON.parse(localStorage.getItem(`vocab_prac_${selectedBook}`)) || [];

          setErrorList(loadedErr);
          setPracticedWords(loadedPrac);
          setHistoricalErrors(loadedHist);
          setMode('all'); 
          setRightTab('current');
        } catch(e) {}
      }, [selectedBook]);

      useEffect(() => { localStorage.setItem(`vocab_err_${selectedBook}`, JSON.stringify(errorList)); }, [errorList, selectedBook]);
      useEffect(() => { localStorage.setItem(`vocab_prac_${selectedBook}`, JSON.stringify(practicedWords)); }, [practicedWords, selectedBook]);
      useEffect(() => { localStorage.setItem(`vocab_hist_${selectedBook}`, JSON.stringify(historicalErrors)); }, [historicalErrors, selectedBook]);

      const recordError = (wordObj) => {
        setErrorList(prev => {
            const existingIndex = prev.findIndex(w => w.en === wordObj.en);
            if (existingIndex >= 0) {
                const newList = [...prev];
                newList[existingIndex] = { ...newList[existingIndex], streak: 0 };
                return newList;
            }
            return [...prev, { ...wordObj, streak: 0 }];
        });
        setHistoricalErrors(prev => {
            const currentCount = prev[wordObj.en]?.count || 0;
            return {
                ...prev,
                [wordObj.en]: { word: wordObj, count: currentCount + 1 }
            };
        });
      };

        const backupData = {};
        Object.keys(BOOK_LABELS).forEach(b => {
          backupData[`vocab_err_${b}`] = localStorage.getItem(`vocab_err_${b}`) || "[]";
          backupData[`vocab_prac_${b}`] = localStorage.getItem(`vocab_prac_${b}`) || "[]";
          backupData[`vocab_hist_${b}`] = localStorage.getItem(`vocab_hist_${b}`) || "{}";
        });
        
        const jsonString = JSON.stringify(backupData, null, 2);
        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        const fileName = `Vocab_Memory_Backup_${dateStr}.json`;

        if (navigator.share) {
          try {
            const file = new File([jsonString], fileName, { type: "application/json" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: '單字特訓中心備份檔' });
              return; 
            }
          } catch (err) {
            console.log("Share API failed", err);
            if (err.name === 'AbortError') return; 
          }
        }

        try {
          const blob = new Blob([jsonString], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a); 
          a.click();
          setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
        } catch (e) {
          alert("您目前的 App 環境阻擋了下載功能，請改用 Safari 或 Chrome 瀏覽器開啟此網頁即可正常匯出。");
        }
      };

      const triggerImport = () => { if (fileInputRef.current) fileInputRef.current.click(); };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            Object.keys(data).forEach(key => { if (data[key]) localStorage.setItem(key, data[key]); });
            alert('🎉 記憶匯入成功！系統將為您重新載入資料。');
            window.location.reload(); 
          } catch (err) {
            alert('檔案格式錯誤，無法還原記憶。');
          }
        };
        reader.readAsText(file);
        e.target.value = null; 
      };

      const playAudio = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel(); 
          let textToSpeak = text.replace(/\(.*?\)/g, '').replace(/=/g, '').trim();
          if(!textToSpeak) textToSpeak = text; 
          const utterance = new SpeechSynthesisUtterance(textToSpeak);
          utterance.lang = 'en-US';
          utterance.rate = 0.9; 
          const availableVoices = window.speechSynthesis.getVoices();
          if (availableVoices && availableVoices.length > 0) {
            let selectedVoice = availableVoices.find(v => v.name.toLowerCase().includes('moira'));
            if (!selectedVoice) {
              const preferredNames = ['samantha', 'siri', 'daniel', 'alex', 'google us english', 'natural', 'enhanced', 'premium'];
              selectedVoice = availableVoices.find(v => preferredNames.some(p => v.name.toLowerCase().includes(p)));
            }
            if (!selectedVoice) selectedVoice = availableVoices.find(v => v.lang.startsWith('en') || v.lang.includes('en'));
            if (selectedVoice) utterance.voice = selectedVoice;
          }
          window._ttsUtterance = utterance; 
          window.speechSynthesis.speak(utterance);
        }
      };

      const getActiveVocab = () => VOCABULARY.filter(w => w.b === selectedBook);

      const shuffleArray = (array) => {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
      };

      const getBattleDirection = (step) => {
        switch(step) {
          case 1: return 'mcq-en-zh'; 
          case 2: return 'mcq-zh-en'; 
          case 3: return 'zh-en';     
          case 4: return 'dictation'; 
          default: return 'mcq-en-zh';
        }
      };

      const generateQuestion = () => {
        const fullList = getActiveVocab();
        const currentMode = modeRef.current;
        let nextWord;
        let nextDir = directionRef.current;

        if (currentMode === 'battle') {
          const q = battleQueueRef.current;
          const idx = battleIndexRef.current;
          const step = battleStepRef.current;

          if (idx >= q.length) {
            setCurrentWord(null);
            return;
          }
          nextWord = q[idx];
          nextDir = getBattleDirection(step);
          setDirection(nextDir); 
        } else {
          const activeList = currentMode === 'errors' ? errorListRef.current : fullList;
          if (activeList.length === 0) {
            setCurrentWord(null);
            return;
          }

          let randomIndex;
          if (currentMode === 'all') {
            const unpracticedIndices = activeList
              .map((w, index) => ({ w, index }))
              .filter(({ w }) => !practicedWordsRef.current.includes(w.en))
              .map(({ index }) => index);
              
            if (unpracticedIndices.length > 0) {
              randomIndex = unpracticedIndices[Math.floor(Math.random() * unpracticedIndices.length)];
            } else {
              randomIndex = Math.floor(Math.random() * activeList.length);
            }
          } else {
            randomIndex = Math.floor(Math.random() * activeList.length);
          }
          nextWord = activeList[randomIndex];
        }
        
        setCurrentWord(nextWord);
        
        let isAskingEnglish = true;
        if (nextDir === 'random') {
          isAskingEnglish = Math.random() > 0.5;
        } else if (nextDir === 'zh-en' || nextDir === 'dictation' || nextDir === 'mcq-zh-en') {
          isAskingEnglish = true; 
        } else if (nextDir === 'en-zh' || nextDir === 'mcq-en-zh') {
          isAskingEnglish = false;
        }
        setAskEnglish(isAskingEnglish);

        if (nextDir === 'mcq-zh-en' || nextDir === 'mcq-en-zh') {
          const pool = fullList.filter(w => w.en !== nextWord.en);
          const distractors = shuffleArray(pool).slice(0, 3);
          const options = shuffleArray([nextWord, ...distractors]);
          setMultipleChoiceOptions(options);
        } else {
          setMultipleChoiceOptions([]);
        }

        if (nextDir === 'dictation' || nextDir === 'en-zh' || nextDir === 'mcq-en-zh') {
          setTimeout(() => playAudio(nextWord.en), 100);
        }

        setUserInput('');
        setFeedback(null);
        setAttemptCount(0); 
        setIsDictationRevealed(false);
        setIsFlipped(false);
        setSelectedOption(null);
        
        if (nextDir !== 'mcq-zh-en' && nextDir !== 'mcq-en-zh') {
           setTimeout(() => {
               if (inputRef.current) inputRef.current.focus();
           }, 50);
        }
      };

      useEffect(() => {
        if (mode !== 'list') {
            generateQuestion();
        }
      }, [mode, selectedBook]);

      const stripPunctuation = (str) => str.toLowerCase().replace(/(\.\.\.|[.。!！？?])/g, '').trim();

      const getHintMessage = (input, validAnswersArray) => {
        const cleanInput = stripPunctuation(input);
        for (let rawAns of validAnswersArray) {
          const ans = stripPunctuation(rawAns);
          if (ans.length <= 1) continue; 
          
          if (ans.includes(cleanInput) && cleanInput.length >= Math.max(1, Math.floor(ans.length / 2))) {
            return "很接近了！你的答案似乎少了一些字，檢查一下尾綴或單位。";
          }
          if (cleanInput.includes(ans)) {
            return "很接近了！你的答案有包含正解，但多了一些不必要的字。";
          }
          let sharedChars = 0;
          const uniqueInputChars = [...new Set(cleanInput.split(''))];
          for (let char of uniqueInputChars) {
            if (ans.includes(char)) sharedChars++;
          }
          if (sharedChars >= Math.max(1, Math.floor(ans.length / 1.5))) {
            return "有抓到關鍵字！但部分用字或拼寫需要稍微調整！";
          }
        }
        return null; 
      };

      const handleHintClick = () => {
         if (!currentWord || isTerminalState) return;
         const targetAns = askEnglish ? currentWord.en : currentWord.zh.split(/[;/]/)[0];
         const cleanAns = targetAns.replace(/\(.*?\)/g, '').trim();
         if(cleanAns.length > 0) {
            const firstChar = cleanAns.charAt(0);
            setUserInput(firstChar);
            if (inputRef.current) inputRef.current.focus();
         }
      };

      const getHiddenSentence = (sentence, wordObj) => {
        if (!sentence) return "";
        try {
          const baseWord = wordObj.en.split('/')[0].replace(/\(.*?\)/g, '').trim();
          if (baseWord.length < 2) return sentence; 
          const regex = new RegExp(`\\b${baseWord}\\w*\\b`, 'gi');
          return sentence.replace(regex, '_______');
        } catch (e) {
          return sentence;
        }
      };

      const handleExpandListWord = (wordStr) => {
        if (expandedListWord === wordStr) {
          setExpandedListWord(null);
        } else {
          setExpandedListWord(wordStr);
        }
      };

      const handleUnfamiliar = () => {
        if (!currentWord || isTerminalState) return;
        if (!practicedWords.includes(currentWord.en)) setPracticedWords(prev => [...prev, currentWord.en]);
        recordError(currentWord);
        const correctAnswer = askEnglish ? currentWord.en : currentWord.zh;
        setFeedback({ status: 'unfamiliar', msg: `已收錄至錯題本！正確答案是：「 ${correctAnswer} 」` });
        if (direction === 'dictation') setIsDictationRevealed(true);
      };

      const handleNextAction = () => {
         if (feedback?.status === 'unfamiliar' || feedback?.status === 'wrong' || feedback?.status === 'correct') {
            generateQuestion();
         } else if (direction === 'dictation' && !isDictationRevealed) {
            setIsDictationRevealed(true);
         } else {
            if (!practicedWords.includes(currentWord.en)) setPracticedWords(prev => [...prev, currentWord.en]);
            generateQuestion();
         }
      };

      const handleOptionClick = (option) => {
        if (isTerminalState) return; 
        setSelectedOption(option);
        if (!practicedWords.includes(currentWord.en)) setPracticedWords(prev => [...prev, currentWord.en]);

        if (option.en === currentWord.en) {
          if (modeRef.current === 'battle') {
            const nextStep = battleStepRef.current + 1;
            if (nextStep > 4) {
                setBattleStep(1);
                setBattleIndex(prev => prev + 1);
                setFeedback({ status: 'correct', msg: '🎉 擊破！換下一個敵人！' });
            } else {
                setBattleStep(nextStep);
                setFeedback({ status: 'correct', msg: `答對了！進入階段 ${nextStep}/4 ...` });
            }
          } else if (modeRef.current === 'errors') {
            const currentStreak = (currentWord.streak || 0) + 1;
            if (currentStreak >= 3) {
              setFeedback({ status: 'correct', msg: '🎉 完美掌握！已移出錯題本！' });
              setErrorList(prev => prev.filter(w => w.en !== currentWord.en));
            } else {
              setFeedback({ status: 'correct', msg: `答對了！(連對 ${currentStreak}/3 次)` });
              setErrorList(prev => prev.map(w => w.en === currentWord.en ? { ...w, streak: currentStreak } : w));
            }
          } else {
            setFeedback({ status: 'correct', msg: '答對了！' });
          }
          if (direction === 'mcq-zh-en' || (modeRef.current === 'battle' && battleStepRef.current === 2)) playAudio(currentWord.en); 
          setTimeout(() => generateQuestion(), 800);
        } else {
          setFeedback({ status: 'wrong', msg: `錯誤！正確答案是：「 ${askEnglish ? currentWord.en : currentWord.zh} 」` });
          recordError(currentWord);
          if (direction === 'mcq-zh-en' || (modeRef.current === 'battle' && battleStepRef.current === 2)) playAudio(currentWord.en); 
        }
      };

      window._handleOptionClick = handleOptionClick;
      window._handleUnfamiliar = handleUnfamiliar;
      window._handleNextAction = handleNextAction;
      window._playAudio = playAudio;
      window._handleHintClick = handleHintClick;
      // === 閃卡專屬捷徑控制 ===
      // === 閃卡專屬捷徑控制 (具備滑動回饋與防連按鎖定) ===
      window._handleFlashcardUnclear = (word) => {
        if (stateRef.current.swipeAnim) return; // 鎖定狀態，防止連按
        setSwipeAnim('left');
        setTimeout(() => { recordError(word); generateQuestion(); setSwipeAnim(null); }, 300);
      };
      window._handleFlashcardGotIt = (word) => {
        if (stateRef.current.swipeAnim) return; // 鎖定狀態，防止連按
        setSwipeAnim('right');
        setTimeout(() => { 
          setPracticedWords(prev => prev.includes(word.en) ? prev : [...prev, word.en]); 
          generateQuestion(); 
          setSwipeAnim(null); 
        }, 300);
      };
      window._toggleFlashcard = () => setIsFlipped(prev => !prev);

      // 更新 stateRef 以追蹤最新狀態
      const stateRef = useRef({ direction, isTerminalState, multipleChoiceOptions, currentWord, askEnglish, isFlipped, swipeAnim });
      useEffect(() => {
          stateRef.current = { direction, isTerminalState, multipleChoiceOptions, currentWord, askEnglish, isFlipped, swipeAnim };
      }, [direction, isTerminalState, multipleChoiceOptions, currentWord, askEnglish, isFlipped, swipeAnim]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (document.activeElement.tagName === 'SELECT') return;
          const { direction, isTerminalState, multipleChoiceOptions, currentWord, isFlipped } = stateRef.current;
          const isInputFocused = document.activeElement.tagName === 'INPUT';

          
          // === 閃卡模式專屬按鍵攔截 ===
          if (direction === 'flashcard') {
             if (e.key === 'ArrowDown') {
                 e.preventDefault(); 
                 window._toggleFlashcard();
             } else if (e.key === 'ArrowUp') {
                 e.preventDefault(); 
                 if (currentWord) window._playAudio(currentWord.en);
             } else if (e.key === 'ArrowLeft' && isFlipped) {
                 e.preventDefault();
                 window._handleFlashcardUnclear(currentWord); // 傳入 currentWord
             } else if (e.key === 'ArrowRight' && isFlipped) {
                 e.preventDefault();
                 window._handleFlashcardGotIt(currentWord); // 傳入 currentWord
             }
             return; 
          }

          if (e.key === 'Enter' && !e.shiftKey && isTerminalState) {
             e.preventDefault();
             window._handleNextAction();
             return;
          }

          if ((direction === 'mcq-zh-en' || direction === 'mcq-en-zh') && !isTerminalState && !isInputFocused) {
            if (e.key === '1' && multipleChoiceOptions.length > 0) window._handleOptionClick(multipleChoiceOptions[0]);
            if (e.key === '2' && multipleChoiceOptions.length > 1) window._handleOptionClick(multipleChoiceOptions[1]);
            if (e.key === '3' && multipleChoiceOptions.length > 2) window._handleOptionClick(multipleChoiceOptions[2]);
            if (e.key === '4' && multipleChoiceOptions.length > 3) window._handleOptionClick(multipleChoiceOptions[3]);
            if (e.key === '5') {
              window._handleUnfamiliar();
              if (direction === 'mcq-zh-en' && currentWord) window._playAudio(currentWord.en);
            }
            return;
          }

          if (direction !== 'mcq-zh-en' && direction !== 'mcq-en-zh' && !isTerminalState) {
            if (e.key === 'ArrowUp') {
              e.preventDefault();
              if (currentWord) window._playAudio(currentWord.en);
            } else if (e.key === 'ArrowDown') {
              e.preventDefault();
              window._handleHintClick();
            } else if (e.key === 'Escape') {
              e.preventDefault();
              window._handleUnfamiliar();
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []); 

      useEffect(() => {
        const handleGlobalClick = (e) => {
          if (mode === 'list' || direction === 'mcq-zh-en' || direction === 'mcq-en-zh' || isTerminalState) return;
          if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SELECT') {
            if (inputRef.current) inputRef.current.focus();
          }
        };
        window.addEventListener('click', handleGlobalClick);
        return () => window.removeEventListener('click', handleGlobalClick);
      }, [mode, direction, isTerminalState]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (isTerminalState) { handleNextAction(); return; }
        if (direction === 'mcq-zh-en' || direction === 'mcq-en-zh') return;
        if (!userInput.trim() || !currentWord) return;
        if (!practicedWords.includes(currentWord.en)) setPracticedWords(prev => [...prev, currentWord.en]);

        const normalizedInput = userInput.trim().toLowerCase();
        const cleanNormalizedInput = stripPunctuation(normalizedInput);
        
        let isCorrect = false;
        let possibleAnswers = [];
        let strippedAnswers = []; 

        if (askEnglish) {
          const enParts = currentWord.en.split('/').map(s => s.trim().toLowerCase());
          enParts.forEach(part => {
            possibleAnswers.push(part);
            const strippedEn = part.replace(/\(.*?\)/g, '').trim();
            if (strippedEn) possibleAnswers.push(strippedEn);
            const parensRegex = /\(([^)]+)\)/g;
            let match;
            while ((match = parensRegex.exec(part)) !== null) {
              const innerText = match[1].replace(/=/g, '').trim();
              if (innerText && !/[\u4e00-\u9fa5]/.test(innerText)) {
                const subParts = innerText.split(',').map(s => s.trim());
                subParts.forEach(sp => { if (sp) possibleAnswers.push(sp); });
              }
            }
          });
          possibleAnswers = [...new Set(possibleAnswers)];
          isCorrect = possibleAnswers.includes(normalizedInput) || possibleAnswers.some(ans => stripPunctuation(ans) === cleanNormalizedInput);
        } else {
          possibleAnswers = (currentWord.zh || "").split(/[;/]/).map(s => s.trim());
          strippedAnswers = possibleAnswers.map(s => s.replace(/\(.*?\)/g, '').trim());
          isCorrect = possibleAnswers.includes(normalizedInput) || strippedAnswers.includes(normalizedInput) || possibleAnswers.some(ans => stripPunctuation(ans) === cleanNormalizedInput) || strippedAnswers.some(ans => stripPunctuation(ans) === cleanNormalizedInput);
        }

        if (isCorrect) {
          if (modeRef.current === 'battle') {
            const nextStep = battleStepRef.current + 1;
            if (nextStep > 4) {
                setBattleStep(1);
                setBattleIndex(prev => prev + 1);
                setFeedback({ status: 'correct', msg: '🎉 擊破！換下一個敵人！' });
            } else {
                setBattleStep(nextStep);
                setFeedback({ status: 'correct', msg: `答對了！進入階段 ${nextStep}/4 ...` });
            }
          } else if (modeRef.current === 'errors') {
            const currentStreak = (currentWord.streak || 0) + 1;
            if (currentStreak >= 3) {
              setFeedback({ status: 'correct', msg: '🎉 完美掌握！已移出錯題本！' });
              setErrorList(prev => prev.filter(w => w.en !== currentWord.en));
            } else {
              setFeedback({ status: 'correct', msg: `答對了！(連對 ${currentStreak}/3 次)` });
              setErrorList(prev => prev.map(w => w.en === currentWord.en ? { ...w, streak: currentStreak } : w));
            }
          } else {
            setFeedback({ status: 'correct', msg: '答對了！' });
          }
          setTimeout(() => generateQuestion(), 800);
        } else {
          const answersToCompare = askEnglish ? possibleAnswers : strippedAnswers;
          const hint = getHintMessage(normalizedInput, answersToCompare);
          if (hint && attemptCount === 0) {
            setFeedback({ status: 'hint', msg: hint });
            setAttemptCount(1);
          } else {
            const correctAnswer = askEnglish ? currentWord.en : currentWord.zh;
            setFeedback({ status: 'wrong', msg: `錯誤！正確答案是：「 ${correctAnswer} 」` });
            recordError(currentWord);
            setAttemptCount(0);
            if (direction === 'dictation') setIsDictationRevealed(true);
          }
        }
      };

      // === 請替換成這樣 ===
      const fullList = getActiveVocab();
      const totalWords = fullList.length;
      
      // --- 新增的分頁變數計算 ---
      const WORDS_PER_PAGE = 50;
      const totalPages = Math.ceil(totalWords / WORDS_PER_PAGE);
      const startIndex = (currentPage - 1) * WORDS_PER_PAGE;
      const currentList = fullList.slice(startIndex, startIndex + WORDS_PER_PAGE);
      // -----------------------

      const practicedCount = practicedWords.length;
      const progressPercent = Math.round((practicedCount / totalWords) * 100) || 0;
      const sortedHistory = Object.values(historicalErrors).sort((a, b) => b.count - a.count);

      

      const requestResetProgress = () => {
        setConfirmModal({
          isOpen: true,
          title: '💥 重置單元進度',
          message: `確定要重置【${BOOK_LABELS[selectedBook]}】的進度嗎？（不會刪除錯題本）`,
          onConfirm: () => { setPracticedWords([]); setConfirmModal(prev => ({ ...prev, isOpen: false })); },
          showCancel: true
        });
      };

      const requestClearErrors = () => {
        setConfirmModal({
          isOpen: true,
          title: '🕸️ 清空當前錯題',
          message: `確定要清空【${BOOK_LABELS[selectedBook]}】的錯題本嗎？`,
          onConfirm: () => { setErrorList([]); setConfirmModal(prev => ({ ...prev, isOpen: false })); },
          showCancel: true
        });
      };

      const requestClearHistory = () => {
        setConfirmModal({
          isOpen: true,
          title: '🕷️ 清空歷史大數據',
          message: `確定要清空【${BOOK_LABELS[selectedBook]}】的頑固單字紀錄嗎？清空後將重新計算。`,
          onConfirm: () => { setHistoricalErrors({}); setConfirmModal(prev => ({ ...prev, isOpen: false })); },
          showCancel: true
        });
      };

      const recallHistoricalErrors = () => {
        const topWords = sortedHistory.slice(0, 10).map(item => item.word);
        if (topWords.length === 0) return;
        setErrorList(prev => {
          const newList = [...prev];
          topWords.forEach(w => { if (!newList.some(x => x.en === w.en)) newList.push({ ...w, streak: 0 }); });
          return newList;
        });
        setMode('errors');
        setRightTab('current');
        alert("已成功將歷史最常錯的單字召回至當前錯題本！準備開始特訓。");
      };

      const startBattleMode = () => {
        const words = sortedHistory.map(item => item.word);
        if (words.length === 0) return;
        setBattleQueue(words);
        setBattleIndex(0);
        setBattleStep(1);
        setMode('battle');
      };

      return (
        <div className="min-h-screen p-4 md:p-8 font-sans relative flex flex-col spider-bg text-slate-900 selection:bg-red-500 selection:text-white overflow-x-hidden">
          <div className="max-w-6xl mx-auto space-y-6 w-full flex-1 flex flex-col relative z-10">
            
            <header className="bg-white p-6 rounded-xl border-4 border-slate-900 shadow-[8px_8px_0_0_#e23636] shrink-0 relative overflow-hidden">
              <div className="absolute -right-10 -top-4 opacity-10 text-9xl font-black italic pointer-events-none">BOOM!</div>
              <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 relative z-10">
                <div className="w-full lg:w-auto">
                  <div className="flex flex-col sm:flex-row items-start sm:items-center gap-3 mb-2">
                    <h1 className="text-3xl font-black text-slate-900 tracking-tight uppercase italic">🕷️ Spidey Vocab</h1>
                    <select 
  value={selectedBook}

                                        ? getHiddenSentence(currentWord.ex, currentWord)

                                    </p>
                                    {isTerminalState && currentWord.ex_zh && (
                                      <div className="border-t-2 border-indigo-200/50 pt-2 mt-1">
                                        <p className="text-sm text-indigo-900/70 font-black">{currentWord.ex_zh}</p>
                                      </div>
                                    )}
                                  </div>
                                </div>
                              )}
                            </div>
                          )}
                        </div>

                        {direction === 'mcq-zh-en' || direction === 'mcq-en-zh' ? (
                          <div className="w-full max-w-md mx-auto space-y-3 shrink-0">
                            {multipleChoiceOptions.map((option, idx) => {
                              let btnClass = "w-full text-left px-5 py-4 rounded-xl border-4 font-black text-lg transition-transform shadow-[4px_4px_0_0_#1e293b] flex items-center ";
                              if (!isTerminalState) {
                                btnClass += "border-slate-900 bg-white text-slate-900 hover:-translate-y-1 hover:bg-blue-50";
                              } else {
                                if (option.en === currentWord.en) {
                                  btnClass += "border-slate-900 bg-green-400 text-slate-900 translate-x-1 translate-y-1 shadow-none";
                                } else if (selectedOption && option.en === selectedOption.en) {
                                  btnClass += "border-slate-900 bg-red-500 text-white translate-x-1 translate-y-1 shadow-none";
                                } else {
                                  btnClass += "border-slate-900 bg-slate-200 text-slate-500 opacity-50 shadow-none";
                                }
                              }
                              return (
                                <button key={idx} onClick={() => handleOptionClick(option)} disabled={isTerminalState} className={btnClass}>
                                  {askEnglish ? option.en : `${option.zh} [${option.pos}]`}
                                </button>
                              );
                            })}
                            {!isTerminalState && (
                              <button onClick={() => { handleUnfamiliar(); if (direction === 'mcq-zh-en') playAudio(currentWord.en); }} className="w-full bg-yellow-400 hover:bg-yellow-300 text-slate-900 py-3.5 rounded-xl border-4 border-slate-900 font-black shadow-[4px_4px_0_0_#1e293b] hover:-translate-y-1 transition-transform text-lg mt-4 uppercase flex items-center justify-center gap-2">
                                UNCLEAR (不熟)
                              </button>
                            )}
                            <div className="min-h-[4rem] flex items-center justify-center text-center mt-2">
                              {feedback && (
                                <div className={`text-lg font-black px-6 py-2 rounded-xl border-4 border-slate-900 shadow-[4px_4px_0_0_#1e293b] w-full transform -rotate-1 ${feedback.status === 'correct' ? 'bg-green-400 text-slate-900' : feedback.status === 'unfamiliar' ? 'bg-yellow-400 text-slate-900' : 'bg-red-500 text-white'}`}>
                                  {feedback.msg}
                                </div>
                              )}
                            </div>
                            {isTerminalState && (
                              <button onClick={handleNextAction} className="w-full bg-blue-600 hover:bg-blue-500 text-white border-4 border-slate-900 py-4 rounded-xl font-black shadow-[4px_4px_0_0_#1e293b] text-xl mt-1 transition-transform transform hover:-translate-y-1 active:translate-y-0 active:shadow-none uppercase tracking-widest flex items-center justify-center gap-2">
                                NEXT 
                              </button>
                            )}
                          </div>
                        ) : (
                          <form onSubmit={handleSubmit} className="w-full max-w-md shrink-0">
                            <div className="relative w-full">
                              <input
                                ref={inputRef}
                                type="text"
                                value={userInput}
                                onChange={(e) => { if (!isTerminalState) setUserInput(e.target.value); }}
                                placeholder="輸入答案..."
                                className={`w-full text-center text-2xl p-4 pr-16 rounded-xl border-4 transition-all outline-none font-black
                                  ${feedback?.status === 'correct' ? 'border-slate-900 bg-green-400 text-slate-900 shadow-[6px_6px_0_0_#1e293b]' : 
                                    feedback?.status === 'unfamiliar' || feedback?.status === 'hint' ? 'border-slate-900 bg-yellow-300 text-slate-900 shadow-[6px_6px_0_0_#1e293b]' :
                                    feedback?.status === 'wrong' ? 'border-slate-900 bg-red-500 text-white shadow-[6px_6px_0_0_#1e293b]' : 
                                    'border-slate-900 focus:shadow-[8px_8px_0_0_#e23636] focus:-translate-y-1'}`}
                                autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck="false"
                              />
                              {!isTerminalState && (
                                <button type="button" onClick={handleHintClick} className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-black bg-slate-900 text-white px-2 py-1 rounded-md hover:bg-slate-700 transition-colors focus:outline-none shadow-[2px_2px_0_0_#e23636]" title="提示首字母">
                                  HINT 
                                </button>
                              )}
                            </div>
                            <div className="min-h-[4rem] mt-6 flex items-center justify-center text-center">
                              {feedback && (
                                <div className={`text-lg font-black px-6 py-2 rounded-xl border-4 border-slate-900 shadow-[4px_4px_0_0_#1e293b] w-full transform ${feedback.status === 'correct' ? 'bg-green-400 text-slate-900 rotate-1' : feedback.status === 'unfamiliar' || feedback.status === 'hint' ? 'bg-yellow-400 text-slate-900 -rotate-1' : 'bg-red-500 text-white -rotate-1'}`}>
                                  {feedback.msg}
                                </div>
                              )}
                            </div>
                            {isTerminalState ? (
                               <button type="button" onClick={handleNextAction} className="w-full bg-blue-600 hover:bg-blue-500 text-white border-4 border-slate-900 py-4 rounded-xl font-black shadow-[6px_6px_0_0_#1e293b] text-xl mt-4 transition-transform transform hover:-translate-y-1 active:translate-y-0 active:shadow-none uppercase tracking-widest flex justify-center items-center gap-3">
                                  NEXT 
                               </button>
                            ) : (
                               <div className="flex flex-col gap-4 mt-4">
                                  <button type="submit" className="w-full bg-red-600 hover:bg-red-500 text-white border-4 border-slate-900 py-4 rounded-xl font-black shadow-[6px_6px_0_0_#1e293b] text-xl transition-transform transform hover:-translate-y-1 active:translate-y-0 active:shadow-none uppercase tracking-wider flex justify-center items-center gap-3">
                                     SUBMIT (提交) 
                                  </button>
                                  <div className="flex gap-4">
                                     <button type="button" onClick={handleUnfamiliar} className="w-full bg-yellow-400 hover:bg-yellow-300 text-slate-900 border-4 border-slate-900 py-3.5 rounded-xl font-black transition-transform hover:-translate-y-1 shadow-[4px_4px_0_0_#1e293b] text-base uppercase flex justify-center items-center gap-2">
                                        UNCLEAR 
                                     </button>
                                  </div>
                               </div>
                            )}
                          </form>
                        )}
                      </React.Fragment>
                      )
                    ) : (
                        <div className="text-center text-slate-900 py-16 animate-fade-in">
                        <span className="text-7xl block mb-6 drop-shadow-[4px_4px_0_rgba(30,41,59,1)]">CLEAR!</span>
                        <h3 className="text-3xl font-black mb-4 uppercase italic tracking-tight">Mission Accomplished</h3>
                        <p className="font-bold text-slate-600 bg-yellow-300 inline-block px-4 py-1 rounded border-2 border-slate-900 shadow-[2px_2px_0_0_#1e293b]">
                          {mode === 'battle' ? '所有頑固敵人都已經被消滅！太棒了！' : '任務完成，請點選上方按鈕切換題庫或檢視總覽！'}
                        </p>
                        {mode === 'battle' && (
                           <button onClick={() => setMode('all')} className="mt-8 px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white border-4 border-slate-900 rounded-xl font-black transition-transform hover:-translate-y-1 shadow-[4px_4px_0_0_#1e293b] uppercase">
                              返回綜合題庫
                           </button>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>

              {}
              <div className="bg-white rounded-xl border-4 border-slate-900 shadow-[8px_8px_0_0_#eab308] flex flex-col h-[500px] md:h-[calc(100vh-10rem)] md:max-h-[800px] md:sticky md:top-8 overflow-hidden shrink-0 relative z-10">
                <div className="flex border-b-4 border-slate-900 shrink-0">
                  <button onClick={() => setRightTab('current')} className={`flex-1 py-4 font-black text-sm transition-colors border-r-4 border-slate-900 uppercase ${rightTab === 'current' ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-red-100'}`}>
                    ERRORS ({errorList.length})
                  </button>
                  <button onClick={() => setRightTab('history')} className={`flex-1 py-4 font-black text-sm transition-colors uppercase ${rightTab === 'history' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-blue-100'}`}>
                    HARD WORDS
                  </button>
                </div>
                
                <div className="p-4 flex-grow overflow-y-auto min-h-0 bg-slate-50 custom-scrollbar">
                  {rightTab === 'current' ? (
                    errorList.length === 0 ? (
                      <div className="text-center text-slate-400 py-16 flex flex-col items-center">
                        <span className="text-6xl mb-4 font-black text-slate-300">0</span>
                        <p className="font-black text-slate-400 uppercase tracking-widest">No Errors Found</p>
                      </div>
                    ) : (
                      <ul className="space-y-3">
                        {errorList.map((err, idx) => (
                          <li key={idx} className="bg-white p-4 rounded-xl border-4 border-slate-900 flex justify-between items-center shadow-[4px_4px_0_0_#1e293b] hover:-translate-y-1 transition-transform group relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-2 h-full bg-red-500"></div>
                            <div className="pl-2">
                              <div className="font-black text-slate-900 text-xl italic tracking-tight">{err.en}</div>
                              <div className="text-sm font-bold text-slate-600 mt-1 flex items-center gap-2">
                                {err.zh}
                                <span className="text-[10px] bg-yellow-300 border-2 border-slate-900 text-slate-900 px-1.5 py-0.5 rounded font-black shadow-[2px_2px_0_0_#1e293b]">{err.pos}</span>
                                <span className="text-[10px] bg-red-100 text-red-600 border-2 border-slate-900 px-1.5 py-0.5 rounded font-black shadow-[2px_2px_0_0_#1e293b]">連對 {err.streak || 0}/3</span>
                              </div>
                            </div>
                            <button onClick={() => playAudio(err.en)} className="p-2 text-slate-900 hover:text-white hover:bg-blue-600 bg-slate-100 rounded-full border-2 border-slate-900 shadow-[2px_2px_0_0_#1e293b] focus:outline-none transition-colors" title="聽發音">
                               <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clipRule="evenodd" /></svg>
                            </button>
                          </li>
                        ))}
                      </ul>
                    )
                  ) : (
                    sortedHistory.length === 0 ? (
                      <div className="text-center text-slate-400 py-16 flex flex-col items-center">
                        <span className="text-6xl mb-4 font-black text-slate-300">N/A</span>
                        <p className="font-black text-slate-400 uppercase tracking-widest">Perfect Score</p>
                      </div>
                    ) : (
                      <ul className="space-y-3">
                        {sortedHistory.map((item, idx) => (
                          <li key={idx} className="bg-white p-4 rounded-xl border-4 border-slate-900 flex justify-between items-center shadow-[4px_4px_0_0_#1e293b] hover:-translate-y-1 transition-transform group relative overflow-hidden">
                            <div className="absolute top-0 right-0 bg-red-600 text-white text-xs font-black px-2 py-1 rounded-bl-lg border-b-4 border-l-4 border-slate-900 shadow-[-2px_2px_0_0_#1e293b]">
                              錯 {item.count} 次
                            </div>
                            <div className="absolute top-0 left-0 w-2 h-full bg-blue-600"></div>
                            <div className="mt-1 pl-2">
                              <div className="font-black text-slate-900 text-xl italic tracking-tight">{item.word.en}</div>
                              <div className="text-sm font-bold text-slate-600 mt-1 flex items-center gap-2">
                                {item.word.zh}
                                <span className="text-[10px] bg-yellow-300 border-2 border-slate-900 text-slate-900 px-1.5 py-0.5 rounded font-black shadow-[2px_2px_0_0_#1e293b]">{item.word.pos}</span>
                              </div>
                            </div>
                            <button onClick={() => playAudio(item.word.en)} className="p-2 text-slate-900 hover:text-white hover:bg-blue-600 bg-slate-100 rounded-full border-2 border-slate-900 shadow-[2px_2px_0_0_#1e293b] focus:outline-none transition-colors mt-2" title="聽發音">
                               <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M9.383 3.076A1 1 0 0110 4v12a1 1 0 01-1.707.707L4.586 13H2a1 1 0 01-1-1V8a1 1 0 011-1h2.586l3.707-3.707a1 1 0 011.09-.217zM14.657 2.929a1 1 0 011.414 0A9.972 9.972 0 0119 10a9.972 9.972 0 01-2.929 7.071 1 1 0 01-1.414-1.414A7.971 7.971 0 0017 10c0-2.21-.894-4.208-2.343-5.657a1 1 0 010-1.414zm-2.829 2.828a1 1 0 011.415 0A5.983 5.983 0 0115 10a5.984 5.984 0 01-1.757 4.243 1 1 0 01-1.415-1.415A3.984 3.984 0 0013 10a3.983 3.983 0 00-1.172-2.828 1 1 0 010-1.415z" clipRule="evenodd" /></svg>
                            </button>
                          </li>
                        ))}
                      </ul>
                    )
                  )}
                </div>
                
                <div className="p-5 border-t-4 border-slate-900 bg-slate-100 flex flex-col gap-3 shrink-0">
                  {rightTab === 'current' ? (
                    <button onClick={requestClearErrors} disabled={errorList.length === 0} className="w-full py-3 text-sm text-white bg-red-600 hover:bg-red-500 border-4 border-slate-900 rounded-xl font-black transition-transform hover:-translate-y-1 shadow-[4px_4px_0_0_#1e293b] disabled:opacity-50 disabled:hover:translate-y-0 uppercase">
                      CLEAR ERRORS (清空)
                    </button>
                  ) : (
                    <React.Fragment>
                      {mode === 'battle' ? (
                        <button disabled className="w-full py-3 text-sm text-white bg-slate-500 border-4 border-slate-900 rounded-xl font-black uppercase opacity-50 cursor-not-allowed shadow-none">
                          戰鬥中不可操作
                        </button>
                      ) : (
                        <React.Fragment>
                          <button onClick={startBattleMode} disabled={sortedHistory.length === 0} className="w-full py-3 text-sm text-white bg-purple-600 hover:bg-purple-500 border-4 border-slate-900 rounded-xl font-black transition-transform hover:-translate-y-1 shadow-[4px_4px_0_0_#1e293b] disabled:opacity-50 disabled:hover:translate-y-0 uppercase animate-pulse">
                            ⚔️ ENTER BATTLE MODE
                          </button>
                          <button onClick={recallHistoricalErrors} disabled={sortedHistory.length === 0} className="w-full py-3 text-sm text-slate-900 bg-yellow-400 hover:bg-yellow-300 border-4 border-slate-900 rounded-xl font-black transition-transform hover:-translate-y-1 shadow-[4px_4px_0_0_#1e293b] disabled:opacity-50 disabled:hover:translate-y-0 uppercase">
                            RECALL TOP 10 (召回前十名)
                          </button>
                          <button onClick={requestClearHistory} disabled={sortedHistory.length === 0} className="w-full py-2 text-xs text-slate-500 hover:text-slate-900 hover:bg-slate-200 rounded-lg font-bold transition-colors focus:outline-none disabled:opacity-50 uppercase tracking-wider">
                            RESET HISTORY
                          </button>
                        </React.Fragment>
                      )}
                    </React.Fragment>
                  )}
                </div>
              </div>
            </main>
          </div>

          {confirmModal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in">
              <div className="bg-white rounded-2xl border-4 border-slate-900 shadow-[12px_12px_0_0_#e23636] w-full max-w-sm overflow-hidden transform transition-all scale-100 rotate-1">
                <div className="px-6 py-6 bg-yellow-300 border-b-4 border-slate-900">
                  <h3 className="text-2xl font-black text-slate-900 uppercase italic tracking-tight">{confirmModal.title}</h3>
                </div>
                <div className="px-6 py-6 bg-white">
                  <p className="text-slate-700 font-bold text-[16px] leading-relaxed">{confirmModal.message}</p>
                </div>
                <div className="bg-slate-100 px-6 py-4 flex gap-4 justify-end border-t-4 border-slate-900">
                  {confirmModal.showCancel && (
                    <button onClick={() => setConfirmModal(prev => ({ ...prev, isOpen: false }))} className="px-5 py-2.5 text-sm font-black text-slate-900 hover:bg-slate-200 bg-white border-4 border-slate-900 rounded-xl transition-transform hover:-translate-y-1 shadow-[4px_4px_0_0_#1e293b] uppercase">
                      CANCEL
                    </button>
                  )}
                  <button onClick={confirmModal.onConfirm} className="px-5 py-2.5 text-sm font-black text-white bg-blue-600 hover:bg-blue-500 border-4 border-slate-900 rounded-xl transition-transform hover:-translate-y-1 shadow-[4px_4px_0_0_#1e293b] uppercase w-full sm:w-auto">
                    OK
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    .spider-bg {
      background-color: #0f172a; 
      background-image: 
        radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 70%),
        repeating-linear-gradient(45deg, rgba(226, 54, 54, 0.05) 0px, rgba(226, 54, 54, 0.05) 2px, transparent 2px, transparent 30px),
        repeating-linear-gradient(-45deg, rgba(37, 99, 235, 0.05) 0px, rgba(37, 99, 235, 0.05) 2px, transparent 2px, transparent 30px);
      background-attachment: fixed;
    }
    body { font-family: 'Helvetica Neue', 'Arial Black', sans-serif, 'Microsoft JhengHei'; }
    .custom-scrollbar::-webkit-scrollbar { width: 12px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-left: 4px solid #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #e23636; border: 2px solid #0f172a; border-radius: 10px; }
    
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { 
      backface-visibility: hidden; 
      -webkit-backface-visibility: hidden; 
    }
    .rotate-y-180 { transform: rotateY(180deg); }



  </style>
</body>
</html>
