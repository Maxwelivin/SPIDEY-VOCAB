<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spidey Vocab Multiverse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background-color: #0f172a; 
    }
    
    /* 蜘蛛人主題背景 */
    .spider-bg {
      background-color: #0f172a; 
      background-image: 
        radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 70%),
        radial-gradient(rgba(226, 54, 54, 0.15) 1.5px, transparent 1.5px),
        radial-gradient(rgba(37, 99, 235, 0.15) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      background-position: 0 0, 0 0, 10px 10px;
      background-attachment: fixed;
    }

    /* 漫畫風公用類別 */
    .comic-shadow { box-shadow: 8px 8px 0px 0px #0f172a; }
    .comic-shadow-blue { box-shadow: 6px 6px 0px 0px #2563eb; }
    
    .active\:comic-pressed:active {
      transform: translate(6px, 6px) scale(0.98) !important;
      box-shadow: 0px 0px 0px 0px #0f172a !important;
      transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
  </style>
</head>
<body class="text-slate-900 selection:bg-red-500 selection:text-white spider-bg flex items-center justify-center p-6">

  <div class="w-full max-w-md bg-white rounded-3xl p-8 border-4 border-slate-900 comic-shadow relative overflow-hidden animate-fade-in">
    
    <!-- 背景裝飾 -->
    <div class="absolute -right-6 -top-8 text-slate-100 text-9xl font-black italic pointer-events-none transform -rotate-12 z-0 select-none" style="font-family: 'Impact'">HUB</div>

    <!-- 標題區塊 -->
    <div class="relative z-10 flex flex-col items-center text-center mb-10">
      <img src="https://cdn-icons-png.flaticon.com/512/1090/1090806.png" alt="Spidey Avatar" class="w-24 h-24 object-cover rounded-2xl border-4 border-slate-900 comic-shadow-blue transform -rotate-3 bg-white mb-4">
      <h1 class="text-4xl font-black text-slate-900 tracking-tight italic leading-none" style="font-family: 'Impact'">SPIDEY VOCAB</h1>
      <h2 class="text-3xl font-black text-blue-600 tracking-tight italic leading-none mt-1" style="font-family: 'Impact'">MULTIVERSE</h2>
      <p class="text-slate-900 font-black tracking-widest text-xs mt-4 bg-yellow-300 inline-block px-3 py-1 transform rotate-2 border-2 border-slate-900">Choose the universe you want to enter</p>
    </div>

    <!-- 傳送門按鈕區塊 -->
    <div class="relative z-10 flex flex-col w-full space-y-5">
      
      <a href="./spiderman.html" class="block w-full py-5 bg-red-600 text-white font-black text-xl text-center rounded-xl border-4 border-slate-900 comic-shadow active:comic-pressed transition-transform tracking-widest">
        Original Spider-Man
      </a>
      
      <a href="./highschool.html" class="block w-full py-5 bg-blue-600 text-white font-black text-xl text-center rounded-xl border-4 border-slate-900 comic-shadow active:comic-pressed transition-transform tracking-widest">
        The Amazing Spider-Man
      </a>
      
      <a href="./elementary.html" class="block w-full py-5 bg-yellow-400 text-slate-900 font-black text-xl text-center rounded-xl border-4 border-slate-900 comic-shadow active:comic-pressed transition-transform tracking-widest">
        MCU Spider-Man
      </a>

    </div>
  </div>

</body>
</html>
